services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: veurubro
      POSTGRES_PASSWORD: veurubro_dev
      POSTGRES_DB: veurubro
    ports:
      - "${VEURUBRO_POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veurubro"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${VEURUBRO_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
